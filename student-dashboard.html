<style>
/* ==========================================================================
   ResultTrack — Design Tokens (Official Brand Identity)
   Verified Blue / Clarity Teal / Ink / Slate / Mist + semantic Success/Error
   Display: Sora · Body: Inter
   ========================================================================== */

:root {
  /* ---- Brand palette ---- */
  --verified-blue: #1B3A8A;
  --verified-blue-600: #16307A;
  --verified-blue-700: #10245C;
  --verified-blue-50: #EEF1FB;
  --clarity-teal: #0C9C93;
  --clarity-teal-600: #0A8177;
  --clarity-teal-50: #E7F7F5;
  --ink: #0E1524;
  --slate: #6B7280;
  --slate-400: #9CA3AF;
  --slate-200: #D7DCE8;
  --mist: #F4F6F8;
  --mist-100: #EAEDF1;
  --white: #FFFFFF;

  /* ---- Semantic (reserved for meaning, not decoration) ---- */
  --success: #2F9E5B;
  --success-bg: #E7F6ED;
  --warning: #9A6400;
  --warning-bg: #FBF1DC;
  --danger: #D6483F;
  --danger-bg: #FBEBEA;
  --info: var(--verified-blue);
  --info-bg: var(--verified-blue-50);

  /* ---- Surfaces ---- */
  --surface: var(--white);
  --surface-sunken: var(--mist);
  --border: var(--slate-200);
  --border-strong: #B9C1D4;

  /* ---- Typography ---- */
  --font-display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;

  /* ---- Radius ---- */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 16px;
  --r-full: 999px;

  /* ---- Shadow ---- */
  --shadow-sm: 0 1px 2px rgba(14, 21, 36, 0.06);
  --shadow-md: 0 6px 20px rgba(14, 21, 36, 0.08);
  --shadow-lg: 0 20px 48px rgba(14, 21, 36, 0.14);
  --shadow-focus: 0 0 0 3px rgba(27, 58, 138, 0.22);

  /* ---- Motion ---- */
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 140ms;
  --dur-med: 240ms;
  --dur-slow: 420ms;

  /* ---- Layout ---- */
  --sidebar-w: 264px;
  --topbar-h: 68px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

/* ==========================================================================
   ResultTrack — Base & Shared Components
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--mist);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; color: var(--ink); }
p { margin: 0; }
button { font-family: inherit; }
a { color: var(--verified-blue); }
img, svg { display: block; max-width: 100%; }

/* Focus visibility — WCAG AA */
:focus-visible {
  outline: none;
  box-shadow: var(--shadow-focus);
  border-radius: var(--r-sm);
}
button:focus-visible, a:focus-visible, input:focus-visible,
select:focus-visible, [tabindex]:focus-visible {
  box-shadow: var(--shadow-focus);
}

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}

.skip-link {
  position: absolute; left: 12px; top: -48px;
  background: var(--ink); color: var(--white);
  padding: 10px 16px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 600; z-index: 999;
  transition: top var(--dur-fast) var(--ease);
}
.skip-link:focus { top: 12px; }

/* ---- Buttons ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-family: var(--font-body); font-weight: 600; font-size: 14px;
  padding: 11px 20px; border-radius: var(--r-md);
  border: 1px solid transparent; cursor: pointer;
  transition: background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease),
              transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  min-height: 44px; line-height: 1;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn svg { width: 17px; height: 17px; flex-shrink: 0; }

.btn-primary { background: var(--verified-blue); color: var(--white); }
.btn-primary:hover:not(:disabled) { background: var(--verified-blue-600); }

.btn-secondary { background: var(--white); color: var(--ink); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--mist-100); }

.btn-ghost { background: transparent; color: var(--slate); border-color: transparent; }
.btn-ghost:hover:not(:disabled) { background: var(--mist-100); color: var(--ink); }

.btn-danger { background: var(--danger); color: var(--white); }
.btn-danger:hover:not(:disabled) { background: #8f1e18; }

.btn-sm { padding: 7px 14px; font-size: 13px; min-height: 34px; border-radius: var(--r-sm); }
.btn-block { width: 100%; }
.btn-icon { padding: 9px; min-width: 38px; min-height: 38px; }

/* ---- Form fields ---- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; text-align: left; }
.field-row { display: flex; align-items: center; justify-content: space-between; }
.label {
  font-size: 13px; font-weight: 600; color: var(--ink); letter-spacing: 0.01em;
}
.label .req { color: var(--danger); margin-left: 2px; }
.hint { font-size: 12.5px; color: var(--slate); }
.input-wrap { position: relative; display: flex; align-items: center; }
.input, .select {
  width: 100%; font-size: 14.5px; font-family: var(--font-body); color: var(--ink);
  background: var(--white); border: 1.5px solid var(--border-strong);
  border-radius: var(--r-md); padding: 12px 14px; min-height: 46px;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.input:hover, .select:hover { border-color: var(--slate-400); }
.input:focus, .select:focus {
  outline: none; border-color: var(--verified-blue); box-shadow: var(--shadow-focus);
}
.input[data-state="error"] { border-color: var(--danger); }
.input[data-state="error"]:focus { box-shadow: 0 0 0 3px rgba(179,38,30,0.18); }
.input[data-state="success"] { border-color: var(--success); }
.input-wrap .toggle-visibility {
  position: absolute; right: 6px; background: none; border: none; cursor: pointer;
  color: var(--slate); padding: 8px; border-radius: var(--r-sm); display: flex;
}
.input-wrap .toggle-visibility:hover { color: var(--ink); background: var(--mist-100); }
.input-wrap.has-toggle .input { padding-right: 42px; }
.error-msg {
  font-size: 12.5px; color: var(--danger); display: flex; align-items: center; gap: 5px;
  min-height: 0;
}
.error-msg[hidden] { display: none; }
.checkbox-row { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--ink); }
.checkbox-row input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: var(--verified-blue); cursor: pointer; flex-shrink: 0;
}
.checkbox-row label { cursor: pointer; }

/* ---- Badges ---- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
  padding: 3px 9px 3px 7px; border-radius: var(--r-full); font-family: var(--font-mono);
  white-space: nowrap;
}
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-info { background: var(--info-bg); color: var(--verified-blue); }
.badge-neutral { background: var(--mist-100); color: var(--slate); }

/* ---- Toasts ---- */
#toast-region {
  position: fixed; top: 20px; right: 20px; z-index: 1000;
  display: flex; flex-direction: column; gap: 10px; width: min(360px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--ink); color: var(--white); padding: 14px 16px;
  border-radius: var(--r-md); box-shadow: var(--shadow-lg); font-size: 13.5px;
  animation: toast-in var(--dur-med) var(--ease);
}
.toast svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }
.toast strong { display: block; font-weight: 700; margin-bottom: 2px; }
.toast.success { background: #0E3D2C; }
.toast.error { background: #4A1512; }
.toast.info { background: var(--verified-blue-700); }
@keyframes toast-in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

/* ---- Modal / overlay (Coming soon, confirmations) ---- */
.overlay {
  position: fixed; inset: 0; background: rgba(14, 21, 36, 0.55);
  backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center;
  padding: 20px; z-index: 900; opacity: 0; pointer-events: none;
  transition: opacity var(--dur-med) var(--ease);
}
.overlay.is-open { opacity: 1; pointer-events: auto; }
.modal {
  background: var(--white); border-radius: var(--r-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 440px; padding: 32px; text-align: center;
  transform: translateY(14px) scale(0.98); transition: transform var(--dur-med) var(--ease);
}
.overlay.is-open .modal { transform: none; }
.modal-icon {
  width: 56px; height: 56px; border-radius: var(--r-full); margin: 0 auto 18px;
  display: flex; align-items: center; justify-content: center;
  background: var(--verified-blue-50); color: var(--verified-blue);
}
.modal h3 { font-size: 19px; margin-bottom: 8px; }
.modal p { color: var(--slate); font-size: 14px; line-height: 1.55; }
.modal .modal-actions { margin-top: 24px; display: flex; gap: 10px; justify-content: center; }

/* ---- Spinner ---- */
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid rgba(255,255,255,0.35); border-top-color: currentColor;
  animation: spin 0.7s linear infinite; flex-shrink: 0;
}
.spinner.dark { border-color: rgba(14,21,36,0.15); border-top-color: var(--verified-blue); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Utility ---- */
.visually-hide { display: none !important; }

/* ==========================================================================
   ResultTrack — Admin Dashboard Shell
   ========================================================================== */

.app-shell { min-height: 100vh; display: flex; }

/* ---- Sidebar ---- */
.sidebar {
  width: var(--sidebar-w); flex-shrink: 0; background: var(--verified-blue-700);
  color: var(--white); display: flex; flex-direction: column;
  position: fixed; inset: 0 auto 0 0; height: 100vh; z-index: 60;
  transition: transform var(--dur-med) var(--ease);
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}
.sidebar-brand .mark {
  width: 34px; height: 34px; border-radius: 9px; background: var(--clarity-teal);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-display); font-weight: 700; font-size: 15px; flex-shrink: 0;
}
.sidebar-brand .name { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
.sidebar-brand .name small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 10px; opacity: 0.65; letter-spacing: 0.06em; margin-top: 1px; }

.sidebar-brand .brand-logo-tile {
  width: 168px; max-width: 100%; background: var(--white); border-radius: var(--r-md);
  padding: 8px 10px; display: flex; align-items: center; box-shadow: var(--shadow-sm);
}
.sidebar-brand .brand-logo-tile img { display: block; width: 100%; height: auto; }

/* ---- Breadcrumb ---- */
.breadcrumb-nav { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--slate); margin-bottom: 10px; flex-wrap: wrap; }
.breadcrumb-nav a, .breadcrumb-nav button { color: var(--slate); text-decoration: none; background: none; border: none; padding: 2px 4px; border-radius: var(--r-sm); font: inherit; cursor: pointer; }
.breadcrumb-nav a:hover, .breadcrumb-nav button:hover { color: var(--verified-blue); background: var(--mist-100); }
.breadcrumb-nav .crumb-current { color: var(--ink); font-weight: 600; }
.breadcrumb-nav svg { width: 13px; height: 13px; color: var(--slate-400); flex-shrink: 0; }

/* ---- App footer ---- */
.app-footer {
  padding: 22px clamp(16px, 3vw, 32px) 28px; font-size: 12px; color: var(--slate-400);
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  border-top: 1px solid var(--border); margin-top: 8px;
}
.app-footer a { color: var(--slate-400); }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 12px 20px; }
.nav-group { margin-bottom: 4px; }
.nav-group-label {
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: rgba(255,255,255,0.45); padding: 16px 12px 6px;
}
.nav-item {
  display: flex; align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 10px 12px; border-radius: var(--r-md); color: rgba(255,255,255,0.82);
  background: none; border: none; font-size: 13.6px; font-weight: 500; cursor: pointer;
  font-family: var(--font-body); transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position: relative;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item:hover { background: rgba(255,255,255,0.08); color: var(--white); }
.nav-item.is-active { background: var(--white); color: var(--verified-blue-700); font-weight: 700; }
.nav-item .nav-badge {
  margin-left: auto; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  background: var(--clarity-teal); color: var(--white); border-radius: var(--r-full);
  padding: 2px 6px; min-width: 18px; text-align: center;
}
.nav-item.is-active .nav-badge { background: var(--verified-blue); color: var(--white); }

.sidebar-footer { padding: 14px; border-top: 1px solid rgba(255,255,255,0.12); }
.sidebar-footer .nav-item { color: rgba(255,255,255,0.7); }

/* ---- Main column ---- */
.main-col { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; min-width: 0; }

.topbar {
  height: var(--topbar-h); background: var(--white); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 24px; position: sticky; top: 0; z-index: 40;
}
.topbar .menu-toggle { display: none; }
.topbar-search { flex: 1; max-width: 420px; position: relative; }
.topbar-search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--slate-400); }
.topbar-search input {
  width: 100%; padding: 9px 12px 9px 38px; border-radius: var(--r-md); border: 1.5px solid var(--border);
  background: var(--mist); font-size: 13.5px; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.topbar-search input:focus { outline: none; background: var(--white); border-color: var(--verified-blue); box-shadow: var(--shadow-focus); }

.topbar-actions { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.icon-btn {
  position: relative; width: 40px; height: 40px; border-radius: var(--r-md); border: none;
  background: none; color: var(--slate); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.icon-btn:hover { background: var(--mist-100); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); border: 2px solid var(--white); }

.profile-btn {
  display: flex; align-items: center; gap: 9px; padding: 6px 10px 6px 6px; border-radius: var(--r-md);
  border: none; background: none; cursor: pointer; transition: background var(--dur-fast) var(--ease);
}
.profile-btn:hover { background: var(--mist-100); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--verified-blue); color: var(--white);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 13px; flex-shrink: 0;
}
.profile-btn .who { text-align: left; }
.profile-btn .who .n { font-size: 13px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.profile-btn .who .r { font-size: 11px; color: var(--slate); font-family: var(--font-mono); }
.profile-btn svg.chev { width: 15px; height: 15px; color: var(--slate-400); }

.dropdown {
  position: absolute; top: calc(100% + 8px); right: 24px; background: var(--white);
  border: 1px solid var(--border); border-radius: var(--r-md); box-shadow: var(--shadow-lg);
  min-width: 240px; z-index: 80; opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); overflow: hidden;
}
.dropdown.is-open { opacity: 1; transform: none; pointer-events: auto; }
.dropdown-head { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.dropdown-head .n { font-size: 13.5px; font-weight: 700; }
.dropdown-head .e { font-size: 12px; color: var(--slate); }
.dropdown-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 16px; font-size: 13.5px;
  color: var(--ink); background: none; border: none; cursor: pointer; text-align: left;
}
.dropdown-item svg { width: 16px; height: 16px; color: var(--slate); }
.dropdown-item:hover { background: var(--mist-100); }
.dropdown-item.danger { color: var(--danger); }
.dropdown-item.danger svg { color: var(--danger); }

.notif-panel { width: 340px; max-height: 420px; overflow-y: auto; }
.notif-item { display: flex; gap: 11px; padding: 13px 16px; border-bottom: 1px solid var(--border); align-items: flex-start; }
.notif-item:last-child { border-bottom: none; }
.notif-item .dot-type { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
.notif-item.success .dot-type { background: var(--success); }
.notif-item.warning .dot-type { background: var(--warning); }
.notif-item.error .dot-type { background: var(--danger); }
.notif-item.info .dot-type { background: var(--verified-blue); }
.notif-item .txt { font-size: 12.8px; line-height: 1.45; }
.notif-item .txt .t { font-weight: 700; color: var(--ink); display: block; margin-bottom: 2px; }
.notif-item .txt .m { color: var(--slate); }
.notif-item .txt .ts { color: var(--slate-400); font-family: var(--font-mono); font-size: 10.5px; margin-top: 4px; display: block; }

/* ---- Content ---- */
.content { padding: 26px clamp(16px, 3vw, 32px) 60px; flex: 1; }
.view-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.view-header .crumb { font-family: var(--font-mono); font-size: 11.5px; color: var(--slate-400); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
.view-header h1 { font-size: 22px; letter-spacing: -0.01em; }
.view-header .sub { font-size: 13.5px; color: var(--slate); margin-top: 4px; }
.view-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---- Stat cards ---- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat-card {
  background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 10px;
}
.stat-card .row1 { display: flex; align-items: center; justify-content: space-between; }
.stat-card .icon-tile { width: 38px; height: 38px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; }
.stat-card .icon-tile svg { width: 19px; height: 19px; }
.stat-card .label { font-size: 12.5px; color: var(--slate); font-weight: 600; }
.stat-card .value { font-family: var(--font-display); font-size: 27px; font-weight: 700; color: var(--ink); }
.stat-card .delta { font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.stat-card .delta.up { color: var(--success); }
.stat-card .delta.down { color: var(--danger); }
.stat-card .delta svg { width: 13px; height: 13px; }

/* ---- Panels / cards ---- */
.panel { background: var(--white); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); gap: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 15.5px; }
.panel-head .sub { font-size: 12px; color: var(--slate); margin-top: 2px; }
.panel-body { padding: 20px; }

.grid-2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
@media (max-width: 980px) { .grid-2 { grid-template-columns: 1fr; } }

/* ---- Charts (pure SVG) ---- */
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.chart-legend .item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--slate); }
.chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.bar-chart .bar-track { fill: var(--mist-100); }
.bar-chart .bar-fill { fill: var(--verified-blue); transition: width var(--dur-slow) var(--ease); }
.bar-chart text { font-family: var(--font-body); font-size: 11px; fill: var(--slate); }
.bar-chart .value-label { font-family: var(--font-mono); font-size: 11px; fill: var(--ink); font-weight: 600; }

/* ---- Toolbar (search/filter/sort for tables) ---- */
.toolbar { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.toolbar-search { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
.toolbar-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--slate-400); }
.toolbar-search input { width: 100%; padding: 9px 12px 9px 36px; border-radius: var(--r-md); border: 1.5px solid var(--border); font-size: 13px; background: var(--mist); }
.toolbar-search input:focus { outline: none; background: var(--white); border-color: var(--verified-blue); }
.toolbar select.select { width: auto; min-height: 38px; padding: 8px 32px 8px 12px; font-size: 13px; }
.toolbar-spacer { flex: 1; }
.toolbar-count { font-size: 12.5px; color: var(--slate); font-family: var(--font-mono); }

/* ---- Table ---- */
.table-wrap { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 640px; }
.data-table thead th {
  text-align: left; padding: 11px 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em;
  text-transform: uppercase; color: var(--slate); background: var(--mist); border-bottom: 1px solid var(--border);
  white-space: nowrap; cursor: pointer; user-select: none;
}
.data-table thead th:hover { color: var(--ink); }
.data-table thead th .sort-ind { display: inline-block; margin-left: 4px; opacity: 0.4; }
.data-table thead th[data-sorted] .sort-ind { opacity: 1; color: var(--verified-blue); }
.data-table thead th.col-check, .data-table td.col-check { width: 40px; }
.data-table tbody td { padding: 13px 16px; border-bottom: 1px solid var(--border); color: var(--ink); vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr:hover { background: var(--mist); }
.data-table .cell-primary { font-weight: 600; }
.data-table .cell-mono { font-family: var(--font-mono); font-size: 12.5px; color: var(--slate); }
.data-table .cell-sub { font-size: 12px; color: var(--slate); margin-top: 1px; }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }

.checkbox-cell input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--verified-blue); cursor: pointer; }

.table-empty { padding: 56px 20px; text-align: center; }
.table-empty .icon-tile { width: 52px; height: 52px; border-radius: var(--r-full); background: var(--mist-100); color: var(--slate-400); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
.table-empty .icon-tile svg { width: 26px; height: 26px; }
.table-empty h3 { font-size: 15px; margin-bottom: 6px; }
.table-empty p { font-size: 13px; color: var(--slate); max-width: 320px; margin: 0 auto; }

.table-loading { padding: 40px 20px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--slate); font-size: 13.5px; }

.pagination { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
.pagination .info { font-size: 12.5px; color: var(--slate); }
.pagination .controls { display: flex; gap: 6px; align-items: center; }
.page-btn {
  width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--white);
  color: var(--ink); font-size: 12.5px; font-family: var(--font-mono); cursor: pointer;
}
.page-btn:hover:not(:disabled) { background: var(--mist-100); }
.page-btn.is-active { background: var(--verified-blue); border-color: var(--verified-blue); color: var(--white); font-weight: 700; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---- Coming soon / placeholder module ---- */
.module-placeholder { padding: 70px 20px; text-align: center; }
.module-placeholder .icon-tile { width: 60px; height: 60px; border-radius: var(--r-full); background: var(--verified-blue-50); color: var(--verified-blue); display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
.module-placeholder .icon-tile svg { width: 30px; height: 30px; }
.module-placeholder h3 { font-size: 17px; margin-bottom: 8px; }
.module-placeholder p { font-size: 13.5px; color: var(--slate); max-width: 380px; margin: 0 auto; line-height: 1.6; }

/* ---- Forms in settings panels ---- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
@media (max-width: 700px) { .form-grid { grid-template-columns: 1fr; } }
.form-actions { display: flex; gap: 10px; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--border); margin-top: 4px; }

/* ---- Activity list ---- */
.activity-list { display: flex; flex-direction: column; }
.activity-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--border); }
.activity-item:last-child { border-bottom: none; padding-bottom: 0; }
.activity-item .dot-type { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.activity-item .dot-type svg { width: 15px; height: 15px; }
.activity-item .txt .t { font-size: 13.3px; color: var(--ink); font-weight: 600; }
.activity-item .txt .m { font-size: 12px; color: var(--slate); margin-top: 1px; }
.activity-item .txt .ts { font-size: 11px; color: var(--slate-400); font-family: var(--font-mono); margin-top: 3px; }

/* Sidebar mobile */
@media (max-width: 980px) {
  .sidebar { transform: translateX(-100%); box-shadow: var(--shadow-lg); }
  .sidebar.is-open { transform: translateX(0); }
  .main-col { margin-left: 0; }
  .topbar .menu-toggle { display: flex; }
  .topbar-search { display: none; }
  .sidebar-scrim {
    position: fixed; inset: 0; background: rgba(14,21,36,0.5); z-index: 55; opacity: 0; pointer-events: none;
    transition: opacity var(--dur-med) var(--ease);
  }
  .sidebar-scrim.is-open { opacity: 1; pointer-events: auto; }
}

/* ==========================================================================
   ResultTrack — Student Dashboard: student-specific components
   ========================================================================== */

/* ---- Welcome hero ---- */
.welcome-card {
  background: linear-gradient(120deg, var(--verified-blue-700), var(--verified-blue));
  border-radius: var(--r-lg); padding: 26px 28px; color: var(--white);
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
  margin-bottom: 22px; flex-wrap: wrap; position: relative; overflow: hidden;
}
.welcome-card::after {
  content: ''; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px;
  border-radius: 50%; background: radial-gradient(circle, rgba(12,156,147,0.35), transparent 70%);
}
.welcome-card .who { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
.welcome-card .avatar-photo {
  width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.5); flex-shrink: 0;
}
.welcome-card .avatar-fallback {
  width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.15); color: var(--white);
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; flex-shrink: 0;
  border: 2px solid rgba(255,255,255,0.4);
}
.welcome-card h1 { font-size: clamp(18px, 2.4vw, 22px); color: var(--white); }
.welcome-card .meta { font-size: 12.8px; color: rgba(255,255,255,0.78); font-family: var(--font-mono); margin-top: 4px; }
.welcome-card .session-chip {
  position: relative; z-index: 1; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
  border-radius: var(--r-md); padding: 12px 16px; text-align: right;
}
.welcome-card .session-chip .l { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.7); }
.welcome-card .session-chip .v { font-family: var(--font-display); font-weight: 700; font-size: 15px; margin-top: 2px; }

/* ---- Quick actions ---- */
.quick-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 22px; }
.quick-action {
  background: var(--white); border: 1.5px solid var(--border); border-radius: var(--r-lg);
  padding: 18px; display: flex; align-items: center; gap: 13px; text-align: left; cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
  min-height: 44px;
}
.quick-action:hover { border-color: var(--verified-blue); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.quick-action .icon-tile { width: 42px; height: 42px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--verified-blue-50); color: var(--verified-blue); }
.quick-action .icon-tile svg { width: 21px; height: 21px; }
.quick-action .t { font-size: 13.8px; font-weight: 700; color: var(--ink); }
.quick-action .s { font-size: 12px; color: var(--slate); margin-top: 1px; }

/* ---- Result flag wizard ---- */
.flag-wizard-steps { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
.flag-wizard-steps .step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--slate-400); }
.flag-wizard-steps .step .num {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center;
  justify-content: center; font-family: var(--font-mono); font-size: 11px; flex-shrink: 0;
}
.flag-wizard-steps .step.is-active { color: var(--ink); }
.flag-wizard-steps .step.is-active .num { background: var(--verified-blue); border-color: var(--verified-blue); color: var(--white); }
.flag-wizard-steps .step.is-done .num { background: var(--success); border-color: var(--success); color: var(--white); }
.flag-wizard-steps .sep { width: 24px; height: 1px; background: var(--border-strong); }

.result-pick-card {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 16px; border: 1.5px solid var(--border); border-radius: var(--r-md); cursor: pointer;
  margin-bottom: 10px; transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.result-pick-card:hover { border-color: var(--verified-blue); background: var(--verified-blue-50); }
.result-pick-card.is-selected { border-color: var(--verified-blue); background: var(--verified-blue-50); }
.result-pick-card .l .code { font-family: var(--font-mono); font-weight: 700; color: var(--ink); font-size: 13.5px; }
.result-pick-card .l .title { font-size: 12.5px; color: var(--slate); margin-top: 2px; }
.result-pick-card .r { text-align: right; }
.result-pick-card .r .score { font-family: var(--font-mono); font-weight: 700; color: var(--ink); }
.result-pick-card .r .grade { font-size: 11.5px; color: var(--slate); }

textarea.input { min-height: 110px; resize: vertical; line-height: 1.5; }

/* ---- Flag status timeline ---- */
.timeline { position: relative; padding-left: 26px; }
.timeline::before { content: ''; position: absolute; left: 8px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
.timeline-item { position: relative; padding-bottom: 22px; }
.timeline-item:last-child { padding-bottom: 0; }
.timeline-item::before {
  content: ''; position: absolute; left: -26px; top: 2px; width: 17px; height: 17px; border-radius: 50%;
  background: var(--white); border: 2.5px solid var(--slate-400);
}
.timeline-item.is-complete::before { border-color: var(--success); background: var(--success); }
.timeline-item.is-current::before { border-color: var(--verified-blue); background: var(--verified-blue); }
.timeline-item .t { font-size: 13.5px; font-weight: 700; color: var(--ink); }
.timeline-item .m { font-size: 12.5px; color: var(--slate); margin-top: 2px; }
.timeline-item .ts { font-size: 11.5px; color: var(--slate-400); font-family: var(--font-mono); margin-top: 3px; }

/* ---- Teacher response conversation ---- */
.conversation { display: flex; flex-direction: column; gap: 16px; }
.conv-bubble { max-width: 82%; padding: 14px 16px; border-radius: var(--r-lg); font-size: 13.6px; line-height: 1.55; }
.conv-bubble .who { font-size: 11.5px; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 5px; font-family: var(--font-mono); }
.conv-bubble.student { align-self: flex-start; background: var(--mist); color: var(--ink); border-bottom-left-radius: 4px; }
.conv-bubble.student .who { color: var(--slate); }
.conv-bubble.lecturer { align-self: flex-end; background: var(--verified-blue-50); color: var(--ink); border-bottom-right-radius: 4px; }
.conv-bubble.lecturer .who { color: var(--verified-blue); }
.conv-bubble .ts { display: block; font-size: 11px; color: var(--slate-400); margin-top: 8px; font-family: var(--font-mono); }
.awaiting-review {
  display: flex; align-items: center; gap: 12px; padding: 18px; background: var(--mist);
  border: 1px dashed var(--border-strong); border-radius: var(--r-md); color: var(--slate); font-size: 13px;
}
.awaiting-review .icon-tile { width: 36px; height: 36px; border-radius: var(--r-full); background: var(--white); color: var(--slate); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---- Notification category chip ---- */
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.chip {
  font-size: 12px; font-weight: 600; padding: 7px 13px; border-radius: var(--r-full); border: 1.5px solid var(--border);
  background: var(--white); color: var(--slate); cursor: pointer; min-height: 34px; display: inline-flex; align-items: center;
}
.chip:hover { border-color: var(--verified-blue); color: var(--ink); }
.chip.is-active { background: var(--verified-blue); border-color: var(--verified-blue); color: var(--white); }

/* ---- Mobile polish ---- */
@media (max-width: 640px) {
  .welcome-card { flex-direction: column; align-items: flex-start; }
  .welcome-card .session-chip { text-align: left; width: 100%; }
  .conv-bubble { max-width: 100%; }
}

</style>
</head>

  REQUEST_OPTIONS: {
    credentials: "include",
    headers: { "Content-Type": "application/json" },

  MOCK: {
    networkDelayMs: 650,

  // Frontend-only storage keys (never sent to the API)
  SESSION_STORAGE_KEY: "resulttrack.session.v1",

<script>
/* ==========================================================================
   ResultTrack — Shared Mock Backend
   ==========================================================================
   Simulates the one piece of real institutional plumbing that has to cross
   between dashboards: a Result Flag raised by a Student must be visible to
   an Administrator (and, eventually, a Lecturer). Since all three surfaces
   are static frontends today, this uses localStorage as a stand-in shared
   database so the Admin Dashboard (resulttrack-auth/dashboard.html) can read
   the exact same flags this dashboard writes, on the same machine/browser.

   Swap-out plan for backend integration: everything below becomes a thin
   wrapper around real POST/GET calls (see api-client.js). No caller of
   ResultTrackSharedBackend.* needs to change.
   ========================================================================== */

const ResultTrackSharedBackend = (() => {
  const KEY = ResultTrackConfig.SHARED_BACKEND_KEY;

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : { flags: [] };
    } catch {
      return { flags: [] };
    }
  }

  function write(db) {
    localStorage.setItem(KEY, JSON.stringify(db));
    // Notify any other open tab/dashboard (e.g. the Admin console) instantly.
    window.dispatchEvent(new CustomEvent("resulttrack:shared-backend-updated"));
  }

  function seedIfEmpty(studentContext) {
    const db = read();
    if (db.flags.length > 0) return;
    db.flags = [
      {
        id: "FLG-0001",
        studentId: studentContext.studentId,
        studentName: studentContext.fullName,
        course: "CSC201",
        courseTitle: "Data Structures & Algorithms",
        component: "Exam Score",
        reasonCategory: "Incorrect score entry",
        explanation: "My exam script score of 68 was recorded as 48. I kept a copy of my marked script showing 68.",
        comments: "",
        status: "resolved",
        assignedLecturer: "Dr. Chidinma Okafor",
        submittedOn: "2026-06-14 10:02",
        lastUpdated: "2026-06-18 15:40",
        response: {
          text: "Reviewed against the original marking sheet — this was a transcription error on our end. Your score has been corrected to 68 and the result has been republished.",
          resolvedOn: "2026-06-18 15:40",
        },
      },
      {
        id: "FLG-0002",
        studentId: studentContext.studentId,
        studentName: studentContext.fullName,
        course: "MTH204",
        courseTitle: "Mathematical Methods II",
        component: "CA Score",
        reasonCategory: "Missing CA score",
        explanation: "I submitted all three CA tests but only two scores appear on my result.",
        comments: "Test 2 was submitted physically in class on the announced date.",
        status: "under_review",
        assignedLecturer: "Dr. Bala Yakubu",
        submittedOn: "2026-07-10 09:15",
        lastUpdated: "2026-07-15 11:20",
        response: null,
      },
    ];
    write(db);
  }

  return {
    getFlagsForStudent(studentId) {
      return read().flags.filter((f) => f.studentId === studentId).sort((a, b) => (a.submittedOn < b.submittedOn ? 1 : -1));
    },
    getAllFlags() {
      return read().flags;
    },
    submitFlag(flag) {
      const db = read();
      const record = {
        id: `FLG-${String(1000 + db.flags.length + 1).slice(-4)}`,
        status: "pending",
        submittedOn: new Date().toISOString().slice(0, 16).replace("T", " "),
        lastUpdated: new Date().toISOString().slice(0, 16).replace("T", " "),
        assignedLecturer: null,
        response: null,
        ...flag,
      };
      db.flags.unshift(record);
      write(db);
      return record;
    },
    /** Dev-only helper: simulates the Lecturer Dashboard picking up and
     * resolving a flag, since that surface doesn't exist yet. Safe to
     * delete once real lecturer responses arrive over the API. */
    simulateLecturerProgress(flagId) {
      const db = read();
      const flag = db.flags.find((f) => f.id === flagId);
      if (!flag) return null;
      if (flag.status === "pending") {
        flag.status = "under_review";
        flag.assignedLecturer = flag.assignedLecturer || "Dr. Grace Adeyemi";
        flag.lastUpdated = new Date().toISOString().slice(0, 16).replace("T", " ");
      } else if (flag.status === "under_review") {
        flag.status = "resolved";
        flag.response = {
          text: "Thanks for flagging this — I've reviewed your submission against my records and updated the score accordingly. The corrected result has been republished.",
          resolvedOn: new Date().toISOString().slice(0, 16).replace("T", " "),
        };
        flag.lastUpdated = flag.response.resolvedOn;
      }
      write(db);
      return flag;
    },
    seedIfEmpty,
    subscribe(callback) {
      window.addEventListener("resulttrack:shared-backend-updated", callback);
      window.addEventListener("storage", (e) => { if (e.key === KEY) callback(); });
    },
  };
})();

</script>
<script>
/* ==========================================================================
   ResultTrack — Student Authentication Service
   ==========================================================================
   The Student Login flow is a separate, already-completed surface. This
   dashboard only ever *consumes* an authenticated session — it never signs
   anyone in. In DATA_MODE "live", getCurrentUser() should read whatever the
   login flow stored (a session cookie + a /students/me call). In "mock"
   mode it reads a locally stored demo session and creates one on first
   visit purely so this dashboard is explorable on its own.
   ========================================================================== */

const ResultTrackAuthService = (() => {
  const cfg = ResultTrackConfig;

  function readStoredSession() {
    try {
      const raw = sessionStorage.getItem(cfg.SESSION_STORAGE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch {
      return null;
    }
  }

  function demoStudent() {
    return {
      studentId: "STU1042",
      matric: "FUHSI/2023/0210",
      firstName: "Amaka",
      middleName: "Chinyere",
      lastName: "Eze",
      fullName: "Amaka Chinyere Eze",
      email: "amaka.eze@student.fuhsi.edu.ng",
      photoUrl: "",
      faculty: "Science",
      department: "Computer Science",
      programme: "B.Sc. Computer Science",
      level: "300",
      session: "2025/2026",
      semester: "Second Semester",
      role: "student",
    };
  }

  async function mockGetCurrentUser() {
    await new Promise((r) => setTimeout(r, cfg.MOCK.networkDelayMs));
    let session = readStoredSession();
    if (!session) {
      session = demoStudent();
      sessionStorage.setItem(cfg.SESSION_STORAGE_KEY, JSON.stringify(session));
    }
    return session;
  }

  async function liveGetCurrentUser() {
    try {
      const res = await fetch(cfg.BASE_URL + cfg.ENDPOINTS.me, {
        credentials: cfg.REQUEST_OPTIONS.credentials,
        headers: cfg.REQUEST_OPTIONS.headers,
      });
      if (!res.ok) return null;
      const payload = await res.json();
      return payload.data || payload;
    } catch {
      return null;
    }
  }

  return {
    async getCurrentUser() {
      return cfg.DATA_MODE === "mock" ? mockGetCurrentUser() : liveGetCurrentUser();
    },
    async logout() {
      if (cfg.DATA_MODE === "live") {
        try { await fetch(cfg.BASE_URL + "/auth/logout", { method: "POST", credentials: "include" }); } catch {}
      }
      sessionStorage.removeItem(cfg.SESSION_STORAGE_KEY);
    },
    isAuthenticated() {
      return !!readStoredSession() || cfg.DATA_MODE === "mock";
    },
  };
})();

</script>
<script>
/* ==========================================================================
   ResultTrack — Student Data Service
   ==========================================================================
   Every screen in the dashboard reads through this service, never through
   hardcoded arrays in the UI. In DATA_MODE "mock" it returns realistic
   local data (and reads flags from the shared mock backend). In "live" mode
   it calls api-client.js, which hits the endpoints in config.js. No view
   code changes between the two.
   ========================================================================== */

const ResultTrackStudentData = (() => {
  const cfg = ResultTrackConfig;
  const delay = (ms = cfg.MOCK.networkDelayMs) => new Promise((r) => setTimeout(r, ms));

  function buildResults() {
    const rows = [
      { code: "CSC201", title: "Data Structures & Algorithms", unit: 3, ca: 28, exam: 40, semester: "First", session: "2025/2026", publishedOn: "2026-02-18" },
      { code: "CSC205", title: "Object-Oriented Programming", unit: 3, ca: 25, exam: 45, semester: "First", session: "2025/2026", publishedOn: "2026-02-18" },
      { code: "MTH204", title: "Mathematical Methods II", unit: 2, ca: 18, exam: 30, semester: "First", session: "2025/2026", publishedOn: "2026-02-20" },
      { code: "GST201", title: "Philosophy & Logic", unit: 2, ca: 27, exam: 38, semester: "First", session: "2025/2026", publishedOn: "2026-02-20" },
      { code: "CSC301", title: "Operating Systems", unit: 3, ca: 22, exam: 33, semester: "Second", session: "2025/2026", publishedOn: "2026-07-05" },
      { code: "CSC305", title: "Database Management Systems", unit: 3, ca: 29, exam: 48, semester: "Second", session: "2025/2026", publishedOn: "2026-07-05" },
      { code: "MTH302", title: "Numerical Analysis", unit: 2, ca: 20, exam: 29, semester: "Second", session: "2025/2026", publishedOn: "2026-07-08" },
      { code: "ECO202", title: "Development Economics", unit: 2, ca: 24, exam: 34, semester: "Second", session: "2025/2026", publishedOn: "2026-07-08" },
      { code: "CSC101", title: "Introduction to Computing", unit: 3, ca: 26, exam: 41, semester: "First", session: "2024/2025", publishedOn: "2025-02-14" },
      { code: "PHY101", title: "General Physics I", unit: 2, ca: 21, exam: 30, semester: "First", session: "2024/2025", publishedOn: "2025-02-14" },
    ];
    return rows.map((r, i) => {
      const total = r.ca + r.exam;
      const { grade, point, remark } = gradeFor(total);
      return { id: `RES${1000 + i}`, ...r, total, grade, point, remark };
    });
  }

  function gradeFor(total) {
    if (total >= 70) return { grade: "A", point: 5.0, remark: "Excellent" };
    if (total >= 60) return { grade: "B", point: 4.0, remark: "Very Good" };
    if (total >= 50) return { grade: "C", point: 3.0, remark: "Good" };
    if (total >= 45) return { grade: "D", point: 2.0, remark: "Pass" };
    return { grade: "F", point: 0.0, remark: "Fail" };
  }

  function buildNotifications() {
    return [
      { id: "N1", category: "Published Result", type: "success", title: "Second semester results published", message: "Your 2025/2026 Second Semester results are now available.", ts: "2026-07-08 09:00", read: false },
      { id: "N2", category: "Flag Under Review", type: "info", title: "MTH204 flag under review", message: "Dr. Bala Yakubu is reviewing your CA score flag.", ts: "2026-07-15 11:20", read: false },
      { id: "N3", category: "Teacher Response Received", type: "success", title: "CSC201 flag resolved", message: "Dr. Chidinma Okafor responded to your result flag.", ts: "2026-06-18 15:40", read: true },
      { id: "N4", category: "Administrative Announcement", type: "info", title: "CGPA policy update", message: "First Class classification threshold updated to 4.50 CGPA.", ts: "2026-06-02 08:30", read: true },
      { id: "N5", category: "Flag Submitted", type: "info", title: "Result flag submitted", message: "Your flag for MTH204 was received and is pending review.", ts: "2026-07-10 09:15", read: true },
      { id: "N6", category: "Administrative Announcement", type: "warning", title: "Portal maintenance notice", message: "ResultTrack will be briefly unavailable Sunday 2–4am for maintenance.", ts: "2026-05-28 16:00", read: true },
    ];
  }

  let _results = null;
  let _notifications = null;

  async function mockGetResults() { await delay(); if (!_results) _results = buildResults(); return _results; }
  async function mockGetNotifications() { await delay(300); if (!_notifications) _notifications = buildNotifications(); return _notifications; }

  async function liveRequest(path) {
    try {
      const res = await fetch(cfg.BASE_URL + path, { credentials: cfg.REQUEST_OPTIONS.credentials, headers: cfg.REQUEST_OPTIONS.headers });
      if (!res.ok) throw new Error("Request failed: " + res.status);
      const payload = await res.json();
      return payload.data || payload;
    } catch (err) {
      throw err;
    }
  }

  return {
    async getResults() {
      return cfg.DATA_MODE === "mock" ? mockGetResults() : liveRequest(cfg.ENDPOINTS.results);
    },
    async getNotifications() {
      return cfg.DATA_MODE === "mock" ? mockGetNotifications() : liveRequest(cfg.ENDPOINTS.notifications);
    },
    markNotificationRead(id) {
      if (!_notifications) return;
      const n = _notifications.find((x) => x.id === id);
      if (n) n.read = true;
      // live mode: PATCH cfg.ENDPOINTS.markNotificationRead.replace(':id', id)
    },
    markAllNotificationsRead() {
      (_notifications || []).forEach((n) => (n.read = true));
    },
    getFlags(studentId) {
      return ResultTrackSharedBackend.getFlagsForStudent(studentId);
    },
    submitFlag(flag) {
      return ResultTrackSharedBackend.submitFlag(flag);
    },
    async getDashboardStats(studentId) {
      const [results, notifications] = await Promise.all([this.getResults(), this.getNotifications()]);
      const flags = this.getFlags(studentId);
      const publishedThisSemester = results.filter((r) => r.session === "2025/2026" && r.semester === "Second");
      const gpaPoints = publishedThisSemester.reduce((sum, r) => sum + r.point * r.unit, 0);
      const units = publishedThisSemester.reduce((sum, r) => sum + r.unit, 0);
      return {
        results, notifications, flags,
        gpa: units ? (gpaPoints / units).toFixed(2) : "—",
        publishedCount: results.length,
        pendingFlags: flags.filter((f) => f.status !== "resolved").length,
        unreadNotifications: notifications.filter((n) => !n.read).length,
      };
    },
  };
})();

</script>
<script>
/* ==========================================================================
   ResultTrack — Student API Client (live-mode mutations)
   ==========================================================================
   Read-heavy data (results, notifications, flags) is fetched directly in
   student-data-service.js. This file covers the mutating calls: submitting
   a flag and marking a notification read. In "mock" mode these are never
   invoked — student-data-service.js and shared-backend.js handle everything
   locally instead.
   ========================================================================== */

const ResultTrackAPI = (() => {
  const cfg = ResultTrackConfig;

  async function post(path, body) {
    const res = await fetch(cfg.BASE_URL + path, {
      method: "POST",
      credentials: cfg.REQUEST_OPTIONS.credentials,
      headers: cfg.REQUEST_OPTIONS.headers,
      body: JSON.stringify(body),
    });
    const payload = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, message: payload.message || payload.error || "", data: payload.data || payload };
  }

  async function patch(path) {
    const res = await fetch(cfg.BASE_URL + path, {
      method: "PATCH",
      credentials: cfg.REQUEST_OPTIONS.credentials,
      headers: cfg.REQUEST_OPTIONS.headers,
    });
    return { ok: res.ok, status: res.status };
  }

  return {
    async submitFlag(flag) {
      if (cfg.DATA_MODE === "mock") return { ok: true, data: ResultTrackStudentData.submitFlag(flag) };
      return post(cfg.ENDPOINTS.submitFlag, flag);
    },
    async markNotificationRead(id) {
      if (cfg.DATA_MODE === "mock") { ResultTrackStudentData.markNotificationRead(id); return { ok: true }; }
      return patch(cfg.ENDPOINTS.markNotificationRead.replace(":id", id));
    },
  };
})();

</script>

(() => {

          <button class="btn btn-primary" data-a="ok">${confirmLabel}</button>
        </div></div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('[data-a="cancel"]').addEventListener("click", () => { overlay.remove(); resolve(false); });
      overlay.querySelector('[data-a="ok"]').addEventListener("click", () => { overlay.remove(); resolve(true); });
      overlay.addEventListener("click", (e) => { if (e.target === overlay) { overlay.remove(); resolve(false); } });
    });
  }

  // ---- Breadcrumb / header helpers ---------------------------------------
  function breadcrumb(trail) {
    // trail: [{label, route?}]
    const parts = trail.map((t, i) => {
      if (i === trail.length - 1) return `<span class="crumb-current">${t.label}</span>`;
      return `<button data-crumb="${t.route}">${t.label}</button>`;
    });
    return `<nav class="breadcrumb-nav" aria-label="Breadcrumb">${parts.join(`<span aria-hidden="true">${icon("chevRight", 13)}</span>`)}</nav>`;
  }
  function wireBreadcrumb(container) {
    container.querySelectorAll("[data-crumb]").forEach((b) => b.addEventListener("click", () => { location.hash = b.dataset.crumb; }));
  }
  function viewHeader(trail, title, sub, actionsHTML = "") {
    return `<div class="view-header"><div>${breadcrumb(trail)}<h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div><div class="view-header-actions">${actionsHTML}</div></div>`;
  }

  // ---- Loading / error states --------------------------------------------
  function loadingBlock(label = "Loading…") {
    return `<div class="panel"><div class="table-loading"><span class="spinner dark"></span>${label}</div></div>`;
  }
  function errorBlock(message, retryId) {
    return `<div class="panel"><div class="table-empty">
      <div class="icon-tile" style="background:var(--danger-bg);color:var(--danger);">${icon("alert", 26)}</div>
      <h3>Couldn't load this</h3><p>${message}</p>
      <button class="btn btn-secondary btn-sm" id="${retryId}" style="margin-top:14px;">${icon("refresh", 14)} Try again</button>
    </div></div>`;
  }

  // ==========================================================================
  // Generic table component (search / sort / filter / pagination / actions)
  // ==========================================================================
  function statusBadge(status) {
    const map = { active: "success", pending: "warning", under_review: "info", resolved: "success", read: "neutral", unread: "info" };
    const label = { under_review: "Under Review", pending: "Pending", resolved: "Resolved" }[status] || status;
    return `<span class="badge badge-${map[status] || "neutral"}">${label}</span>`;
  }

  function buildTablePanel(opts) {
    const state = { search: "", filters: {}, sortKey: opts.defaultSort || null, sortDir: 1, page: 1 };
    const pageSize = opts.pageSize || 8;
    const panel = el("section", "panel");
    const head = el("div", "panel-head");
    head.innerHTML = `<div><h2>${opts.title}</h2>${opts.subtitle ? `<div class="sub">${opts.subtitle}</div>` : ""}</div>`;
    const headActions = el("div", "view-header-actions");
    const refreshBtn = el("button", "btn btn-secondary btn-sm", icon("refresh", 15));
    refreshBtn.setAttribute("aria-label", "Refresh");
    refreshBtn.addEventListener("click", () => { renderBody(); toast("info", "", "List refreshed."); });
    headActions.appendChild(refreshBtn);
    if (opts.addAction) {
      const addBtn = el("button", "btn btn-primary btn-sm", `${icon("plus", 15)} ${opts.addAction.label}`);
      addBtn.addEventListener("click", opts.addAction.onClick);
      headActions.appendChild(addBtn);
    }
    head.appendChild(headActions);
    panel.appendChild(head);

    const toolbar = el("div", "toolbar");
    const searchWrap = el("div", "toolbar-search", icon("search", 16));
    const searchInput = el("input"); searchInput.type = "search"; searchInput.placeholder = `Search ${opts.title.toLowerCase()}…`;
    searchWrap.appendChild(searchInput);
    toolbar.appendChild(searchWrap);
    (opts.filters || []).forEach((f) => {
      const sel = el("select", "select");
      sel.innerHTML = `<option value="">${f.label}: All</option>` + f.options.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
      sel.addEventListener("change", () => { state.filters[f.key] = sel.value; state.page = 1; renderBody(); });
      toolbar.appendChild(sel);
    });
    toolbar.appendChild(el("div", "toolbar-spacer"));
    const countEl = el("span", "toolbar-count");
    toolbar.appendChild(countEl);
    panel.appendChild(toolbar);
    searchInput.addEventListener("input", () => { state.search = searchInput.value.trim().toLowerCase(); state.page = 1; renderBody(); });

    const tableWrap = el("div", "table-wrap");
    panel.appendChild(tableWrap);
    const paginationEl = el("div", "pagination");
    panel.appendChild(paginationEl);

    function getFiltered() {
      let rows = opts.rows.slice();
      if (state.search) {
        const keys = opts.searchKeys || Object.keys(rows[0] || {});
        rows = rows.filter((r) => keys.some((k) => String(r[k] ?? "").toLowerCase().includes(state.search)));
      }
      Object.entries(state.filters).forEach(([k, v]) => { if (v) rows = rows.filter((r) => String(r[k]) === v); });
      if (state.sortKey) rows.sort((a, b) => (a[state.sortKey] === b[state.sortKey] ? 0 : (a[state.sortKey] > b[state.sortKey] ? 1 : -1) * state.sortDir));
      return rows;
    }

    function emptyState({ iconName, title, body }) {
      const wrap = el("div", "table-empty");
      wrap.innerHTML = `<div class="icon-tile">${icon(iconName, 26)}</div><h3>${title}</h3><p>${body}</p>`;
      return wrap;
    }

    function renderBody() {
      const filtered = getFiltered();
      countEl.textContent = `${filtered.length} of ${opts.rows.length}`;
      if (opts.rows.length === 0) { tableWrap.innerHTML = ""; tableWrap.appendChild(emptyState(opts.emptyState)); paginationEl.innerHTML = ""; return; }
      if (filtered.length === 0) { tableWrap.innerHTML = ""; tableWrap.appendChild(emptyState({ iconName: "search", title: "No matches found", body: "Try adjusting your search or filters." })); paginationEl.innerHTML = ""; return; }

      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      state.page = Math.min(state.page, totalPages);
      const pageRows = filtered.slice((state.page - 1) * pageSize, state.page * pageSize);

      const table = el("table", "data-table");
      const thead = el("thead"); const headRow = el("tr");
      opts.columns.forEach((col) => {
        const th = el("th", "", `${col.label}${col.sortable ? `<span class="sort-ind">${state.sortKey === col.key ? (state.sortDir === 1 ? "▲" : "▼") : "↕"}</span>` : ""}`);
        if (col.sortable) { th.addEventListener("click", () => { if (state.sortKey === col.key) state.sortDir *= -1; else { state.sortKey = col.key; state.sortDir = 1; } renderBody(); }); if (state.sortKey === col.key) th.setAttribute("data-sorted", ""); }
        headRow.appendChild(th);
      });
      if (opts.rowActions?.length) headRow.appendChild(el("th"));
      thead.appendChild(headRow); table.appendChild(thead);

      const tbody = el("tbody");
      pageRows.forEach((row) => {
        const tr = el("tr");
        opts.columns.forEach((col) => { const td = el("td"); td.innerHTML = col.render ? col.render(row, statusBadge) : (row[col.key] ?? "—"); tr.appendChild(td); });
        if (opts.rowActions?.length) {
          const td = el("td"); const wrap = el("div", "row-actions");
          opts.rowActions.forEach((a) => {
            if (a.show && !a.show(row)) return;
            const b = el("button", "btn btn-ghost btn-icon btn-sm", icon(a.icon, 15));
            b.title = a.label; b.setAttribute("aria-label", a.label);
            b.addEventListener("click", () => a.onClick(row));
            wrap.appendChild(b);
          });
          td.appendChild(wrap); tr.appendChild(td);
        }
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableWrap.innerHTML = ""; tableWrap.appendChild(table);

      paginationEl.innerHTML = "";
      paginationEl.appendChild(el("span", "info", `Page ${state.page} of ${totalPages} · ${filtered.length} records`));
      const controls = el("div", "controls");
      const prev = el("button", "page-btn", "‹"); prev.disabled = state.page === 1; prev.addEventListener("click", () => { state.page--; renderBody(); });
      controls.appendChild(prev);
      for (let p = 1; p <= totalPages; p++) {
        if (totalPages > 7 && p !== 1 && p !== totalPages && Math.abs(p - state.page) > 1) { if (p === 2 || p === totalPages - 1) controls.appendChild(el("span", "", "…")); continue; }
        const pbtn = el("button", `page-btn${p === state.page ? " is-active" : ""}`, String(p));
        pbtn.addEventListener("click", () => { state.page = p; renderBody(); });
        controls.appendChild(pbtn);
      }
      const next = el("button", "page-btn", "›"); next.disabled = state.page === totalPages; next.addEventListener("click", () => { state.page++; renderBody(); });
      controls.appendChild(next);
      paginationEl.appendChild(controls);
    }

    renderBody();
    return panel;
  }
