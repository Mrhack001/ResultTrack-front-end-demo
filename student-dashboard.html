      list.innerHTML = loadingBlock("Loading your results…");
      let results;
      try { results = await ResultTrackStudentData.getResults(); }
      catch { list.innerHTML = errorBlock("Couldn't load your results.", "retry-step1"); document.getElementById("retry-step1")?.addEventListener("click", renderStep1); return; }

      list.innerHTML = "";
      results.forEach((r) => {
        const card = el("div", "result-pick-card");
        if (prefillCode && r.code === prefillCode) { wizState.selectedResult = r; }
        if (wizState.selectedResult?.id === r.id) card.classList.add("is-selected");
        card.innerHTML = `<div class="l"><div class="code">${r.code}</div><div class="title">${r.title} · ${r.session}, ${r.semester} Semester</div></div>
          <div class="r"><div class="score">${r.total}/100</div><div class="grade">Grade ${r.grade}</div></div>`;
        card.addEventListener("click", () => {
          wizState.selectedResult = r;
          list.querySelectorAll(".result-pick-card").forEach((c) => c.classList.remove("is-selected"));
          card.classList.add("is-selected");
          document.getElementById("to-step-2").disabled = false;
        });
        list.appendChild(card);
      });
      document.getElementById("to-step-2").disabled = !wizState.selectedResult;
      document.getElementById("to-step-2").addEventListener("click", () => { wizState.step = 2; renderStep2(); });
    }

    function renderStep2() {
      body.innerHTML = stepsBar() + `
        <div class="result-pick-card is-selected" style="cursor:default;">
          <div class="l"><div class="code">${wizState.selectedResult.code}</div><div class="title">${wizState.selectedResult.title}</div></div>
          <div class="r"><div class="score">${wizState.selectedResult.total}/100</div><div class="grade">Grade ${wizState.selectedResult.grade}</div></div>
        </div>
        <form id="flag-form" novalidate style="margin-top:18px;">
          <div class="field">
            <label class="label" for="fc-component">Assessment component</label>
            <select class="select" id="fc-component">
              <option value="Overall Score">Overall Score</option>
              <option value="CA Score">Continuous Assessment (CA) Score</option>
              <option value="Exam Score">Examination Score</option>
              <option value="Grade">Final Grade</option>
            </select>
          </div>
          <div class="field">
            <label class="label" for="fc-reason">Reason category <span class="req">*</span></label>
            <select class="select" id="fc-reason" required>
              <option value="">Select a reason…</option>
              <option>Incorrect score entry</option>
              <option>Missing CA score</option>
              <option>Missing exam score</option>
              <option>Score doesn't match my script</option>
              <option>Grade miscalculated</option>
              <option>Other</option>
            </select>
            <p class="error-msg" id="err-reason" hidden></p>
          </div>
          <div class="field">
            <label class="label" for="fc-explain">Detailed explanation <span class="req">*</span></label>
            <textarea class="input" id="fc-explain" required placeholder="Explain clearly why you believe this score is incorrect…"></textarea>
            <p class="error-msg" id="err-explain" hidden></p>
          </div>
          <div class="field">
            <label class="label" for="fc-comments">Additional comments</label>
            <textarea class="input" id="fc-comments" placeholder="Optional — anything else the lecturer should know"></textarea>
          </div>
          <div class="form-actions">
            <button class="btn btn-secondary" type="button" id="back-step-1">Back</button>
            <button class="btn btn-primary" type="submit">Review flag</button>
          </div>
        </form>`;
      document.getElementById("fc-component").value = wizState.component || "Overall Score";
      if (wizState.reasonCategory) document.getElementById("fc-reason").value = wizState.reasonCategory;
      document.getElementById("fc-explain").value = wizState.explanation;
      document.getElementById("fc-comments").value = wizState.comments;
      document.getElementById("back-step-1").addEventListener("click", () => { wizState.step = 1; renderStep1(); });
      document.getElementById("flag-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const reason = document.getElementById("fc-reason").value;
        const explain = document.getElementById("fc-explain").value.trim();
        let hasError = false;
        const reasonErr = document.getElementById("err-reason");
        const explainErr = document.getElementById("err-explain");
        if (!reason) { reasonErr.textContent = "Please select a reason category."; reasonErr.hidden = false; hasError = true; } else reasonErr.hidden = true;
        if (!explain || explain.length < 15) { explainErr.textContent = "Please provide at least a short sentence explaining the issue."; explainErr.hidden = false; hasError = true; } else explainErr.hidden = true;
        if (hasError) return;
        wizState.component = document.getElementById("fc-component").value;
        wizState.reasonCategory = reason;
        wizState.explanation = explain;
        wizState.comments = document.getElementById("fc-comments").value.trim();
        wizState.step = 3;
        renderStep3();
      });
    }

    function renderStep3() {
      body.innerHTML = stepsBar() + `
        <h3 style="font-size:15px;margin-bottom:14px;">Review before submitting</h3>
        <div class="form-grid" style="margin-bottom:10px;">
          <div class="field"><span class="label">Course</span><p style="margin-top:4px;">${wizState.selectedResult.code} — ${wizState.selectedResult.title}</p></div>
          <div class="field"><span class="label">Assessment component</span><p style="margin-top:4px;">${wizState.component}</p></div>
          <div class="field"><span class="label">Reason category</span><p style="margin-top:4px;">${wizState.reasonCategory}</p></div>
        </div>
        <div class="field"><span class="label">Detailed explanation</span><p style="margin-top:4px;color:var(--slate);line-height:1.6;">${wizState.explanation}</p></div>
        ${wizState.comments ? `<div class="field"><span class="label">Additional comments</span><p style="margin-top:4px;color:var(--slate);line-height:1.6;">${wizState.comments}</p></div>` : ""}
        <div class="form-alert info"><span>${icon("alert", 17)}</span><span>Once submitted, this flag will be sent to the course lecturer and the academic records team for review.</span></div>
        <div class="form-actions">
          <button class="btn btn-secondary" type="button" id="back-step-2">Back</button>
          <button class="btn btn-primary" type="button" id="submit-flag"><span class="spinner" style="display:none;"></span><span class="btn-label">Submit flag</span></button>
        </div>`;
      document.getElementById("back-step-2").addEventListener("click", () => { wizState.step = 2; renderStep2(); });
      document.getElementById("submit-flag").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true; btn.querySelector(".spinner").style.display = "inline-block"; btn.querySelector(".btn-label").textContent = "Submitting…";
        const result = await ResultTrackAPI.submitFlag({
          studentId: user.studentId, studentName: user.fullName,
          course: wizState.selectedResult.code, courseTitle: wizState.selectedResult.title,
          component: wizState.component, reasonCategory: wizState.reasonCategory,
          explanation: wizState.explanation, comments: wizState.comments,
        });
        if (result.ok) { renderStep4(result.data); } else { toast("error", "", "Couldn't submit your flag. Please try again."); btn.disabled = false; btn.querySelector(".spinner").style.display = "none"; btn.querySelector(".btn-label").textContent = "Submit flag"; }
      });
    }

    function renderStep4(record) {
      body.innerHTML = `<div class="success-panel">
        <span class="icon-tile" style="width:60px;height:60px;background:var(--success-bg);color:var(--success);margin:0 auto 18px;">${icon("check", 28)}</span>
        <h2>Flag submitted</h2>
        <p>Your flag for <strong>${record.course}</strong> has been sent for review. You'll be notified as soon as there's an update.</p>
        <div style="margin-top:10px;"><span class="badge badge-warning">Pending Review</span></div>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:22px;">
          <a class="btn btn-secondary" href="#flags">View my flags</a>
          <a class="btn btn-primary" href="#dashboard">Back to dashboard</a>
        </div>
      </div>`;
      toast("success", "", "Result flag submitted successfully.");
    }

    renderStep1();
  }

  // ==========================================================================
  // View: Teacher Responses
  // ==========================================================================
  function renderTeacherResponses() {
    root.innerHTML = viewHeader([{ label: "Dashboard", route: "dashboard" }, { label: "Teacher Responses" }], "Teacher Responses", "Lecturer replies to the flags you've raised");
    wireBreadcrumb(root);

    const flags = ResultTrackStudentData.getFlags(user.studentId);
    if (flags.length === 0) {
      const panel = el("section", "panel");
      panel.innerHTML = `<div class="table-empty"><div class="icon-tile">${icon("chat", 26)}</div><h3>No flags to show responses for</h3><p>Once you raise a result flag, any lecturer response will appear here.</p></div>`;
      root.appendChild(panel);
      return;
    }

    flags.forEach((flag) => {
      const panel = el("section", "panel");
      const head = el("div", "panel-head");
      head.innerHTML = `<div><h2>${flag.course} — ${flag.courseTitle}</h2><div class="sub">Submitted ${flag.submittedOn}${flag.assignedLecturer ? ` · ${flag.assignedLecturer}` : ""}</div></div>`;
      const statusWrap = el("div"); statusWrap.innerHTML = statusBadge(flag.status);
      head.appendChild(statusWrap);
      panel.appendChild(head);
      const body = el("div", "panel-body");
      if (flag.response) {
        const conv = el("div", "conversation");
        conv.innerHTML = `
          <div class="conv-bubble student"><div class="who">You</div>${flag.explanation}<span class="ts">${flag.submittedOn}</span></div>
          <div class="conv-bubble lecturer"><div class="who">${flag.assignedLecturer}</div>${flag.response.text}<span class="ts">${flag.response.resolvedOn}</span></div>`;
        body.appendChild(conv);
      } else {
        const wrap = el("div", "awaiting-review");
        wrap.innerHTML = `<span class="icon-tile">${icon("clock", 18)}</span><span>Awaiting Lecturer Review — ${flag.assignedLecturer ? `assigned to ${flag.assignedLecturer}` : "not yet assigned to a lecturer"}.</span>`;
        body.appendChild(wrap);
      }
      panel.appendChild(body);
      root.appendChild(panel);
    });
  }

  // ==========================================================================
  // View: Notifications
  // ==========================================================================
  async function renderNotifications() {
    root.innerHTML = viewHeader([{ label: "Dashboard", route: "dashboard" }, { label: "Notifications" }], "Notifications", "",
      `<button class="btn btn-secondary btn-sm" id="mark-all-read">${icon("check", 15)} Mark all read</button>`);
    wireBreadcrumb(root);
    root.insertAdjacentHTML("beforeend", loadingBlock("Loading notifications…"));

    let items;
    try { items = await ResultTrackStudentData.getNotifications(); }
    catch { root.querySelector(".panel")?.remove(); root.insertAdjacentHTML("beforeend", errorBlock("Notifications couldn't be loaded.", "retry-notif")); document.getElementById("retry-notif")?.addEventListener("click", renderNotifications); return; }
    root.querySelector(".panel")?.remove();

    const state = { category: "", search: "" };
    const categories = [...new Set(items.map((n) => n.category))];

    const panel = el("section", "panel");
    const chipRow = el("div", "chip-row");
    chipRow.style.padding = "16px 20px 0";
    const allChip = el("button", "chip is-active", "All"); chipRow.appendChild(allChip);
    categories.forEach((c) => chipRow.appendChild(el("button", "chip", c)));
    panel.appendChild(chipRow);

    const toolbar = el("div", "toolbar");
    const searchWrap = el("div", "toolbar-search", icon("search", 16));
    const searchInput = el("input"); searchInput.type = "search"; searchInput.placeholder = "Search notifications…";
    searchWrap.appendChild(searchInput);
    toolbar.appendChild(searchWrap);
    panel.appendChild(toolbar);

    const listWrap = el("div");
    panel.appendChild(listWrap);
    root.appendChild(panel);

    chipRow.querySelectorAll(".chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        chipRow.querySelectorAll(".chip").forEach((c) => c.classList.remove("is-active"));
        chip.classList.add("is-active");
        state.category = chip.textContent === "All" ? "" : chip.textContent;
        renderList();
      });
    });
    searchInput.addEventListener("input", () => { state.search = searchInput.value.trim().toLowerCase(); renderList(); });
    document.getElementById("mark-all-read").addEventListener("click", () => { ResultTrackStudentData.markAllNotificationsRead(); toast("success", "", "All notifications marked as read."); renderList(); renderNotifDropdown(); renderSidebar("notifications"); });

    function renderList() {
      let rows = items.slice();
      if (state.category) rows = rows.filter((n) => n.category === state.category);
      if (state.search) rows = rows.filter((n) => (n.title + n.message).toLowerCase().includes(state.search));
      if (rows.length === 0) { listWrap.innerHTML = `<div class="table-empty"><div class="icon-tile">${icon("notif", 26)}</div><h3>No notifications found</h3><p>Try a different filter or search term.</p></div>`; return; }
      listWrap.innerHTML = "";
      rows.forEach((n) => {
        const item = el("div", `notif-item ${n.type}`);
        item.style.cssText = "padding:16px 20px;cursor:pointer;" + (n.read ? "" : "background:var(--verified-blue-50);");
        item.innerHTML = `<span class="dot-type"></span><span class="txt"><span class="t">${n.title} ${!n.read ? '<span class="badge badge-info" style="margin-left:6px;">New</span>' : ""}</span><span class="m">${n.message}</span><span class="ts">${n.category} · ${n.ts}</span></span>`;
        item.addEventListener("click", () => { if (!n.read) { ResultTrackStudentData.markNotificationRead(n.id); n.read = true; renderList(); renderNotifDropdown(); } });
        listWrap.appendChild(item);
      });
    }
    renderList();
  }

  // ==========================================================================
  // View: Profile
  // ==========================================================================
  function renderProfile() {
    root.innerHTML = viewHeader([{ label: "Dashboard", route: "dashboard" }, { label: "Profile" }], "My Profile", "Your academic record details");
    wireBreadcrumb(root);

    const panel = el("section", "panel");
    panel.innerHTML = `<div class="panel-head"><h2>Profile details</h2></div>`;
    const body = el("div", "panel-body");
    body.innerHTML = `
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
        ${user.photoUrl ? `<img class="avatar-photo" style="width:64px;height:64px;" src="${user.photoUrl}" alt="${user.fullName}">` : `<span class="avatar" style="width:64px;height:64px;font-size:22px;">${initials(user.fullName)}</span>`}
        <div><div style="font-family:var(--font-display);font-weight:700;font-size:17px;">${user.fullName}</div>
        <div style="font-size:12.5px;color:var(--slate);font-family:var(--font-mono);">${user.matric}</div></div>
      </div>
      <div class="form-grid">
        <div class="field"><span class="label">First name</span><p style="margin-top:4px;">${user.firstName}</p></div>
        <div class="field"><span class="label">Middle name</span><p style="margin-top:4px;">${user.middleName || "—"}</p></div>
        <div class="field"><span class="label">Last name</span><p style="margin-top:4px;">${user.lastName}</p></div>
        <div class="field"><span class="label">Student ID</span><p style="margin-top:4px;" class="cell-mono">${user.studentId}</p></div>
        <div class="field"><span class="label">Matric number</span><p style="margin-top:4px;" class="cell-mono">${user.matric}</p></div>
        <div class="field"><span class="label">Faculty</span><p style="margin-top:4px;">${user.faculty}</p></div>
        <div class="field"><span class="label">Department</span><p style="margin-top:4px;">${user.department}</p></div>
        <div class="field"><span class="label">Programme</span><p style="margin-top:4px;">${user.programme}</p></div>
        <div class="field"><span class="label">Level</span><p style="margin-top:4px;">${user.level} Level</p></div>
        <div class="field"><span class="label">Academic session</span><p style="margin-top:4px;">${user.session}</p></div>
      </div>
      <p class="hint" style="margin-top:4px;">Academic and identity fields are managed by the registry and shown as read-only. Contact information below can be updated by you.</p>`;
    panel.appendChild(body);
    root.appendChild(panel);

    const contactPanel = el("section", "panel");
    contactPanel.innerHTML = `<div class="panel-head"><h2>Contact information</h2></div>`;
    const cBody = el("div", "panel-body");
    cBody.innerHTML = `<div class="form-grid">
      <div class="field"><label class="label" for="p-email">Email address</label><input class="input" type="email" id="p-email" value="${user.email}"></div>
    </div><div class="form-actions"><button class="btn btn-primary" type="button" id="save-contact">Save changes</button></div>`;
    contactPanel.appendChild(cBody);
    root.appendChild(contactPanel);
    document.getElementById("save-contact").addEventListener("click", () => {
      user.email = document.getElementById("p-email").value.trim() || user.email;
      renderTopbarUser();
      toast("success", "", "Contact information updated.");
    });
  }

  // ---- Router -------------------------------------------------------------
  const ROUTES = {
    dashboard: () => renderDashboard(),
    results: () => renderResults(),
    flags: () => renderFlags(),
    "teacher-responses": () => renderTeacherResponses(),
    notifications: () => renderNotifications(),
    profile: () => renderProfile(),
  };

  function renderRoute() {
    const raw = (location.hash || "#dashboard").slice(1);
    const [base, param] = raw.split("/");
    if (base === "raise-flag") { renderSidebar("flags"); renderRaiseFlag(param); root.focus(); return; }
    if (base === "flag-detail") { renderSidebar("flags"); renderFlagDetail(param); root.focus(); return; }
    const view = ROUTES[base] ? base : "dashboard";
    renderSidebar(view);
    ROUTES[view]();
    root.focus();
  }

  // ---- Boot -----------------------------------------------------------
  (async function init() {
    user = await ResultTrackAuthService.getCurrentUser();
    if (!user) { window.location.href = "login.html"; return; }
    ResultTrackSharedBackend.seedIfEmpty(user);
    renderTopbarUser();
    await renderNotifDropdown();

    document.getElementById("app-loading").style.display = "none";
    document.getElementById("app-shell").style.visibility = "visible";

    window.addEventListener("hashchange", renderRoute);
    renderRoute();
  })();
})();

</script>
</body>
</html>
